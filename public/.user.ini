; =========================================================================
; CONFIGURAÇÃO PHP PARA SERVIDORES FASTCGI / NGINX / SUPHP / CPANEL
; Data Warehouse Eleitoral
; =========================================================================

upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
display_errors = Off
log_errors = On
error_log = error.log
